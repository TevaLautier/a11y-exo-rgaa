<div class="so-shell">
  <div class="so-header">
    <a class="so-logo" routerLink="/" aria-label="Accueil Mobiliere">
      <img src="/assets/logo.png" alt="Logo Mobiliere" class="so-logo-image" />
      <span>Mobiliere</span>
    </a>
    <div class="so-nav">
      <a routerLink="/" routerLinkActive="is-active" [routerLinkActiveOptions]="{ exact: true }"
        >Accueil</a
      >
      <a routerLink="/annonces/recherche" routerLinkActive="is-active">Annonces</a>
      <a routerLink="/agences/recherche" routerLinkActive="is-active">Agences</a>
      <a routerLink="/contact" routerLinkActive="is-active">Nous contacter</a>
      <a routerLink="/inscription" routerLinkActive="is-active">S'inscrire</a>
      <atomic-button-icon
        [icon]="currentTheme === 'dark' ? 'light_mode' : 'dark_mode'"
        label="Changer le theme"
        (click)="toggleTheme()"
      ></atomic-button-icon>
      <!-- <atomic-button-icon
        [icon]="isAccessible ? 'invert_colors_off' : 'invert_colors'"
        label="Activer le mode contraste accessible"
        (click)="toggleAccessible()"
      ></atomic-button-icon> -->
    </div>
  </div>

  <div class="so-main" id="so-main" >
    <router-outlet></router-outlet>
  </div>

  <div class="so-footer" id="so-footer" >
    <a routerLink="/mentions-legales" target="_blank"
      >Mentions légales</a
    >
  </div>
</div>
