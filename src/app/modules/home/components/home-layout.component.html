<div class="so-home-hero">
  <h2 class="so-h1">Bienvenue chez Mobiliere</h2>
  <p>Cliquez sur le menu en haut a droite des annonces pour decouvrir les meilleures offres.</p>
</div>

<app-carousel [listings]="featuredListings()"></app-carousel>

<div class="so-agencies-preview">
  <h3 class="so-h3">Nos agences coup de coeur</h3>
  <ul>
    @for (agency of agencies().slice(0, 3); track agency.id) {
      <li>
        <a [routerLink]="['/agences/recherche', agency.id]">{{ agency.name }}</a>
      </li>
    }
  </ul>
</div>

<section class="mt-6 flex flex-col gap-4">
  <h3 class="so-h3">Investire dans l'immobilier</h3>
  <atomic-youtube-video
    videoId="8pYy5POJSXU"
    title="Comment investir dans l'immobilier"
  ></atomic-youtube-video>
</section>
