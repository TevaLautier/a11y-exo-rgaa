<div class="so-home-hero">
  <h2 class="so-h1">Bienvenue chez Mobiliere</h2>
  <div class="flex gap-6">
    <p>Bienvenue chez Mobilière, le groupe d'agences immobilières le plus efficace de France.</p>
    <atomic-button [link]="['/annonces/recherche']">Voir les annonces</atomic-button>
  </div>
</div>

<app-carousel [listings]="featuredListings()"></app-carousel>

<section class="so-agencies-preview" aria-labelledby="agences-coup-de-coeur">
  <h3 class="so-h3" id="agences-coup-de-coeur">Nos agences coup de coeur</h3>
  <ul>
    @for (agency of agencies().slice(0, 3); track agency.id) {
      <li>
        <a [routerLink]="['/agences/recherche', agency.id]">{{ agency.name }}</a>
      </li>
    }
  </ul>
</section>

<section class="mt-6 flex flex-col gap-4" aria-labelledby="investissement-immobilier">
  <h3 class="so-h3" id="investissement-immobilier">Investire dans l'immobilier</h3>
  <atomic-youtube-video
    videoId="8pYy5POJSXU"
    title="Comment investir dans l'immobilier"
  ></atomic-youtube-video>
</section>
