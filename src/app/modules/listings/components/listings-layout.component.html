<div class="so-page-grid">
  <div class="so-col-filters">
    <h3>Statistiques des prix</h3>
    <atomic-chart
      caption="Filtrage par tranche de prix"
      [options]="chartOptions()"
      [rows]="chartRows()"
      (selectPrice)="selectPrice.emit($event)"
    ></atomic-chart>

    <h3>Filtres</h3>

    <ul class="flex gap-3 mb-3">
      <li>
        <button type="button" (click)="typeChange.emit('Maison')">Maison</button>
      </li>
      <li>
        <button type="button" (click)="typeChange.emit('Appartement')">Appartement</button>
      </li>
      <li>
        <button type="button" (click)="typeChange.emit('Terrain')">Terrain</button>
      </li>
    </ul>

    <atomic-input-text
      id="city"
      label="Ville"
      placeholder="Paris, Lille..."
      [value]="city()"
      (valueChange)="cityChange.emit($event)"
    ></atomic-input-text>

    <label for="city-autocomplete">Ville (autocomplete)</label>
    <input id="city-autocomplete" list="cities" class="so-input" />
    <datalist id="cities">
      <option>Paris</option>
      <option>Lyon</option>
      <option>Marseille</option>
      <option>Toulouse</option>
      <option>Lille</option>
    </datalist>
  </div>

  <div class="so-col-results">
    <p role="status">
      @if (listings().length === 0) {
        Aucune annonce
      } @else {
        {{ listings().length }} annonce{{ listings().length > 1 ? 's' : '' }}
      }
    </p>

    <atomic-table
      caption="Liste des annonces immobilières"
      [headers]="tableHeaders"
      [rows]="tableRows()"
      [sortColumn]="sortColumn()"
      [sortDirection]="sortDirection()"
      [customColumns]="['price', 'actions']"
      [cellTemplate]="listingCell"
      (sortChange)="sortChange.emit($event)"
    ></atomic-table>

    <ng-template #listingCell let-row let-key="key">
      @if (key === 'price') {
        {{ row['price'] | currency: 'EUR' }}
      }

      @if (key === 'actions') {
        <!-- <a
          class="so-icon-link"
          [routerLink]="editLinkBuilder()(row['id'])"
        >
          <mat-icon fontIcon="edit"></mat-icon>
        </a> -->

        <atomic-button-icon
          [icon]="'visibility'"
          [label]="'Voir l\'annonce ' + row['title'] + ' - ' + row['city']"
          [link]="seeLinkBuilder()(row['id'])"
        ></atomic-button-icon>
      }
    </ng-template>

    <atomic-pagination [page]="1" [totalPages]="1"></atomic-pagination>
  </div>
</div>
