<div class="so-carousel" aria-roledescription="carousel">
  <button
    class="so-btn so-btn-secondary so-carousel-prev"
    (click)="previous()"
    aria-label="Annonces précédentes"
  >
    &lsaquo;
  </button>

  <ul class="so-carousel-track">
    @for (listing of visibleListings(); track listing.id) {
      <li>
        <a class="so-slide" [routerLink]="['/annonces/recherche/see/', listing.id]">
          <img [src]="listing.image" alt="" />
          <h3 class="so-h4">{{ listing.title }}</h3>
          <p>{{ listing.city }} - {{ listing.price | currency: 'EUR' }}</p>
        </a>
      </li>
    }
  </ul>

  <button
    class="so-btn so-btn-secondary so-carousel-next"
    (click)="next()"
    aria-label="Annonces suivantes"
  >
    &rsaquo;
  </button>

  <button class="so-btn so-btn-secondary so-carousel-pause" (click)="togglePause()">
    {{ paused() ? 'Lecture' : 'Pause' }}
  </button>
</div>
