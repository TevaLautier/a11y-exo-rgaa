<div class="so-field">
  <label [for]="gid()">
    {{ label() }}
    @if (mandatory()) {
      <span class="so-required">*</span>
    }
  </label>
  <textarea
    [id]="gid()"
    class="so-input"
    [value]="value()"
    [placeholder]="placeholder()"
    [attr.autocomplete]="autocomplete()"
    (input)="onInput($event)"
    [aria-required]="mandatory()"
    [aria-invalid]="showError()"
    [aria-describedby]="showError() ? gid() + '-error' : null"
  ></textarea>
  <atomic-input-error [id]="gid() + '-error'" [visible]="showError()" [messages]="errorMessages()" />
</div>
