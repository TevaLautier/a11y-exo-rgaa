<div class="so-field">
  <label [for]="id()">{{ label() }}</label>
  <textarea
    [id]="id()"
    class="so-input"
    type="text"
    [value]="value()"
    [placeholder]="placeholder()"
    [attr.autocomplete]="autocomplete()"
    (input)="onInput($event)"
    [aria-describedby]="showError() ? id() + '-error' : null"
    [aria-invalid]="showError()"
  ></textarea>
  <atomic-input-error [id]="id()+'-error'" [visible]="showError()" [messages]="errorMessages()" />
</div>
