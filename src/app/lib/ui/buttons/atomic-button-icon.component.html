<button
  class="so-btn so-btn-icon"
  [class.so-btn-primary]="color() === 'primary'"
  [class.so-btn-secondary]="color() === 'secondary'"
  [class.so-btn-tertiary]="color() === 'tertiary'"
  [title]="label()"
  [routerLink]="link()"
>
  <span class="so-sr-only">{{ label() }}</span>
  <mat-icon [fontIcon]="icon()"></mat-icon>
</button>
