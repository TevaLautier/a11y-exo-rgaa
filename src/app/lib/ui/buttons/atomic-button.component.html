<button
  [type]="type()"
  class="so-btn"
  [class.so-btn-primary]="color() === 'primary'"
  [class.so-btn-secondary]="color() === 'secondary'"
  [class.so-btn-tertiary]="color() === 'tertiary'"
  (click)="action.emit()"
>
  @if (icon() && iconPosition() == 'left') {
    <mat-icon>{{ icon() }}</mat-icon>
  }
  <ng-content></ng-content>
  @if (icon() && iconPosition() == 'right') {
    <mat-icon>{{ icon() }}</mat-icon>
  }
</button>
