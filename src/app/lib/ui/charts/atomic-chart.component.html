<div
  aria-hidden="true"
  class="so-chart"
  echarts
  [initOpts]="initOpts"
  [options]="options()"
  (chartClick)="chartClick($event)"
></div>

<table class="so-sr-only so-table">
  <caption>
    {{
      caption()
    }}
  </caption>
  <tr>
    <th scope="col">Tranche de prix</th>
    <th scope="col">Nombre d'annonces</th>
    <th scope="col">Action</th>
  </tr>
  @for (row of rows(); track row.label) {
    <tr>
      <td>{{ row.label }}</td>
      <td>{{ row.value }}</td>
      <td>
        <atomic-button-icon
          color="secondary"
          icon="filter_list"
          (action)="selectPrice.emit(row.label)"
          label="Filtrer la tranche de prix {{ row.label }}"
        >
        </atomic-button-icon>
      </td>
    </tr>
  }
</table>
