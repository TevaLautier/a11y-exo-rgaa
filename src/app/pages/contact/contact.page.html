<div class="so-h2">Nous contacter</div>

<form (ngSubmit)="submit()" class="so-contact-form">
  <atomic-input-text id="name" label="Nom" [formField]="form.name"></atomic-input-text>

  <atomic-input-text id="email" label="Email" [formField]="form.email"></atomic-input-text>

  <atomic-input-textarea
    id="message"
    label="Message"
    [formField]="form.message"
  ></atomic-input-textarea>

  <div class="mt-6">
    <atomic-button (action)="submit()">Envoyer</atomic-button>
  </div>
</form>
